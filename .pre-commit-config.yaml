repos:
  - repo: local
    hooks:
      - id: repository-checks
        name: Repository checks
        entry: python .github/scripts/run_ci.py
        language: python
        additional_dependencies:
          - markdown-it-py==3.0.0
          - mdurl==0.1.2
          - PyYAML==6.0.3
        always_run: true
        pass_filenames: false
        require_serial: true
        stages: [pre-commit]
