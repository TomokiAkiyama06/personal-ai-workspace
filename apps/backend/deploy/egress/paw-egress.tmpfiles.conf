# /etc/tmpfiles.d/paw-egress.conf (Decision 0091, 3): the host's 64 egress
# connection slots. Each session's proxy holds a flock on one of these files
# (opened read-only) for every live connection, and refuses one more when all
# are held. Made here, not by a unit's RuntimeDirectory= (which would go when
# one session ends). The session sockets' directory (/run/paw-egress/session)
# is the socket units'.
d /run/paw-egress 0755 root root -
d /run/paw-egress/slots 0700 paw-egress paw-egress -
f /run/paw-egress/slots/00 0600 paw-egress paw-egress -
