# /etc/paw/egress.toml (root-owned, 0644): the paw-egress proxies, one per CLI
# session (Decision 0087, 3; Decision 0091). Each listens on its session's
# socket, which systemd makes and passes (paw-egress-session@.socket).

# The host's connection slots (paw-egress.tmpfiles.conf): 64 live connections
# on the whole host.
slots = "/run/paw-egress/slots"

# Development only (serve without --session): the socket the proxy makes
# itself. Never a socket shared by the sessions in production.
# socket = "/tmp/paw-egress-dev/egress.sock"

# Exact host names, port 443 only. Claude Code with a subscription token
# (setup-token) talks to the API host; add a host only after the smoke test's
# refusal log shows the CLI needs it (Decision 0087, 4).
allowed_hosts = [
    "api.anthropic.com",
]
