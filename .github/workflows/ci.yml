name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    # Keep this name stable so it can be selected as a required status check.
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      # Throwaway PostgreSQL for the backend integration tests. It exists only
      # for this job and is not reachable from outside the runner, so the
      # password below is not a secret.
      postgres:
        # Pinned by digest like the actions below; refresh the digest deliberately
        # (docker buildx imagetools inspect pgvector/pgvector:pg18) when bumping PostgreSQL.
        # pgvector is required by the memory schema (PAW-040).
        image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_PASSWORD: paw-ci-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt

      - name: Run repository checks
        env:
          # Enables the backend tests that need a real PostgreSQL server.
          PAW_TEST_DATABASE_URL: postgresql://postgres:paw-ci-throwaway@127.0.0.1:5432/postgres
        run: python -m pre_commit run --all-files
