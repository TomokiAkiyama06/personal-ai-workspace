name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    # Keep this name stable so it can be selected as a required status check.
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt

      - name: Test repository checks
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Validate repository
        run: python .github/scripts/check_repository.py
