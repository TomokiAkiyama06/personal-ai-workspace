name: Claude Code

on:
  # PR作成・更新時の自動レビュー
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  # Issue / PRの通常コメントで @claude
  issue_comment:
    types:
      - created

  # PRのコード行へのコメントで @claude
  pull_request_review_comment:
    types:
      - created

  # PR Review本文で @claude
  pull_request_review:
    types:
      - submitted

  # Issue本文・タイトルで @claude
  issues:
    types:
      - opened

jobs:

  # ============================================================
  # 1. PR作成・更新時の自動レビュー
  # ============================================================
  claude-auto-review:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Claude Automatic PR Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          track_progress: true
          use_sticky_comment: true

          additional_permissions: |
            actions: read

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE BRANCH: ${{ github.base_ref }}
            HEAD BRANCH: ${{ github.head_ref }}

            このPull Requestを独立Reviewerとしてレビューしてください。

            このRepositoryでは、
            - Codex = Primary Implementation Agent
            - Claude Code = Independent Reviewer
            - Evaluator = Machine-verifiable success layer
            - Human = Final authority

            という役割分担です。

            この自動レビューでは、
            コード変更、commit、push、Mergeは行わず、
            Reviewのみにしてください。

            最初に、Repository内に存在する場合は以下を確認してください。

            - AGENTS.md
            - REQUIREMENTS.md
            - docs/REQUIREMENTS_FREEZE_REVIEW.md
            - 変更内容に関連する docs/*.md

            その後、このPull Requestのdiffを確認してください。

            総評の投稿まで必要なターンを確保するため、
            関連文書の読み取りや独立した確認は可能な範囲でまとめて行ってください。
            同じ資料の不要な再取得を避け、各レビュー観点の確認は省略しないでください。

            以下を重点的にレビューしてください。

            ## 1. Requirements

            - REQUIREMENTS.mdとの整合性
            - Acceptance Criteriaの達成状況
            - 要件漏れ
            - 要件外変更
            - 過剰実装
            - Architecture documentとの矛盾

            ## 2. Correctness

            - Bug
            - Edge case
            - Error handling
            - State inconsistency
            - Regression
            - Race condition
            - Resource leak

            ## 3. Security

            - Authentication
            - Authorization / RBAC
            - Capability enforcement
            - Tool permissions
            - Secret / Credential handling
            - Privilege escalation
            - Command injection
            - Path traversal
            - Unsafe external network access
            - Public Repositoryへ公開すべきでない情報

            ## 4. Agent architecture

            - Task lifecycle
            - Pause / Resume / Retry / Restart / Cancel / Stop Now
            - Worktree isolation
            - Agent concurrency
            - DAG dependency
            - Resource ownership
            - Human approval boundary
            - Merge authority

            ## 5. Memory / Data

            - Scope
            - ACL
            - Versioning
            - Provenance
            - Freshness
            - Conflict handling
            - Recovery consistency
            - Permission leakage

            ## 6. Testing

            - Test不足
            - Acceptance Criteriaを十分検証しているか
            - Regression test不足
            - Hidden Test / Evaluatorで確認すべき内容
            - Failure caseの不足

            ## 7. Maintainability

            - 不必要な複雑化
            - 重複実装
            - 責務分離
            - 将来拡張を妨げる設計
            - 不明瞭なinterface
            - Documentation不足

            指摘にはSeverityを付けてください。

            - Critical
            - High
            - Medium
            - Low

            具体的なコード行に紐づく問題は、
            可能であればinline review commentを使用してください。

            最後にPull Requestへ総評を投稿してください。

            Blocking findingが存在する場合は、

            - なぜBlockingなのか
            - Merge前に必要な修正

            を明確にしてください。

            Blocking findingが存在しない場合は、

            「Blocking findingなし」

            と明示してください。

            このJobではコード変更、commit、push、Mergeを行わないでください。

          claude_args: |
            --max-turns 40
            --allowedTools "Read,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"


  # ============================================================
  # 2. @claude メンションによるInteractive Mode
  # ============================================================
  claude-mention:
    if: >
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '@claude')) ||

      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude')) ||

      (github.event_name == 'pull_request_review' &&
       contains(github.event.review.body, '@claude')) ||

      (github.event_name == 'issues' &&
       (contains(github.event.issue.body, '@claude') ||
        contains(github.event.issue.title, '@claude')))

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Claude Interactive
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          trigger_phrase: "@claude"

          additional_permissions: |
            actions: read

          claude_args: |
            --max-turns 40
            --allowedTools "Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
