name: Claude PR Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          track_progress: true
          use_sticky_comment: true

          additional_permissions: |
            actions: read

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE BRANCH: ${{ github.base_ref }}
            HEAD BRANCH: ${{ github.head_ref }}

            このPull Requestを独立Reviewerとしてレビューしてください。

            このRepositoryでは、Codexが主実装担当、Claude Codeが独立Reviewerです。
            実装やMergeは行わず、レビューのみにしてください。

            最初に、Repository内に存在する場合は以下を確認してください。

            - AGENTS.md
            - REQUIREMENTS.md
            - docs/REQUIREMENTS_FREEZE_REVIEW.md
            - 変更内容に関連するdocs/*.md

            その上で、このPRのdiffを確認してください。

            特に以下を重点的にレビューしてください。

            1. 要件適合性
               - REQUIREMENTS.mdとの矛盾
               - Acceptance Criteriaの未達
               - 要件外の変更
               - 過剰実装

            2. Correctness
               - バグ
               - 境界条件
               - race condition
               - error handling
               - state不整合
               - regression

            3. Security
               - Authentication
               - Authorization / RBAC
               - Tool permission
               - Secret / Credential handling
               - privilege escalation
               - path traversal
               - command injection
               - unsafe external network access
               - Public Repositoryへ公開してはいけない情報

            4. Agent / Task architecture
               - Task lifecycle
               - Pause / Resume / Retry / Cancel
               - Worktree isolation
               - Multi-Agent concurrency
               - Resource ownership
               - Human approval boundary

            5. Data / Memory
               - scope
               - ACL
               - versioning
               - stale data
               - provenance
               - recovery consistency

            6. Testing
               - Test不足
               - Acceptance Criteriaを検証できているか
               - Regression test不足
               - Hidden/Evaluatorで検証すべき箇所

            7. Maintainability
               - 不必要な複雑化
               - 重複実装
               - 責務分離
               - 将来的な拡張を妨げる設計

            指摘には以下のSeverityを付けてください。

            - Critical
            - High
            - Medium
            - Low

            具体的なコード行に紐づく問題は、可能ならinline review commentを使用してください。

            最後にPRへ総評を投稿してください。

            Blocking findingがある場合:
            - Mergeすべきでない理由
            - 修正が必要な項目
            を明確にしてください。

            Blocking findingが無い場合:
            - 「Blocking findingなし」
            と明示してください。

            コード変更、commit、push、Mergeは行わないでください。

          claude_args: |
            --max-turns 20
            --allowedTools "Read,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"